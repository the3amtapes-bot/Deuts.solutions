<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>503 Service Unavailable</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: #c00;
      text-align: center;
    }
    .error-box {
      max-width: 500px;
    }
    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }
    p {
      font-size: 20px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>503</h1>
    <p>Service Unavailable</p>
    <p>The server is temporarily unable to handle your request. Please contact server admin. </p>
  </div>
</body>
</html>
